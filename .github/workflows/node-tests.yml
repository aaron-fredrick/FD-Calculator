name: JavaScript tests

on:
  push:
    branches: [main, migration/javascript-platform]
  pull_request:
    branches: [main, migration/javascript-platform]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: Syntax-check application and test modules
        run: find src scripts tests/js -name '*.js' -print0 | xargs -0 -n1 node --check
