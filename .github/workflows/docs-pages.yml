          fi
          git checkout -B "$publish_branch" origin/main
          cp "$output_root/docs/strategies/benchmarks/results.json" docs/strategies/benchmarks/results.json
          cp "$output_root/docs/strategies/benchmarks/gaml-search-results.json" docs/strategies/benchmarks/gaml-search-results.json
          cp "$output_root/docs/strategies/benchmarks/.input-fingerprint.json" docs/strategies/benchmarks/.input-fingerprint.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/strategies/benchmarks/results.json
          git add docs/strategies/benchmarks/gaml-search-results.json
          git add docs/strategies/benchmarks/.input-fingerprint.json
          if ! git diff --cached --quiet; then
            git commit -m "benchmarks: refresh scoped strategy measurements ($publish_timestamp LKT)"
            git push origin "HEAD:refs/heads/$publish_branch"
