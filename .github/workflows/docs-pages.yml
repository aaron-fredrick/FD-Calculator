name: Benchmark, build and publish FD Cal documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/benchmark-fingerprint.js"
      - "scripts/strategy-sensitivity.js"
      - "scripts/gaml-sensitivity.js"
      - "scripts/validate-scoped-benchmark-data.js"
      - "scripts/build-docs-site.sh"
      - "scripts/build-docs-preservation.sh"
      - "src/core/**"
      - "src/strategies/**"
      - "src/fd-options/**"
      - "src/io/csv.js"
      - "src/brand/favicon.svg"
      - "data/banks/**"
      - "data/fd_options/**"
      - ".github/workflows/strategy-sensitivity.yml"
      - ".github/workflows/docs-pages.yml"
      - ".github/workflows/pages.yml"
      - "docs/strategies/benchmarks/results.json"
      - "docs/strategies/benchmarks/gaml-search-results.json"
      - "docs/strategies/benchmarks/.input-fingerprint.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-benchmark-pipeline-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      needs_benchmark: ${{ steps.check.outputs.needs_benchmark }}
      blocked_by_data_pr: ${{ steps.check.outputs.blocked_by_data_pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check both the benchmark fingerprint and dataset completeness
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          stale="$(node scripts/benchmark-fingerprint.js --check)"
          expected_fingerprint="$(node scripts/benchmark-fingerprint.js --write)"
          blocked_by_data_pr=false
          open_data_prs="$(gh pr list --base main --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("data-")) | [.number, .headRefName] | @tsv')"

          while read -r pr_number pr_branch; do
            [ -n "$pr_branch" ] || continue
            git fetch --no-tags origin "refs/heads/$pr_branch:refs/remotes/origin/$pr_branch"
            if git show "refs/remotes/origin/$pr_branch:docs/strategies/benchmarks/.input-fingerprint.json" > "$RUNNER_TEMP/data-pr-fingerprint.json" 2>/dev/null; then
              pr_fingerprint="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).fingerprint)" "$RUNNER_TEMP/data-pr-fingerprint.json")"
              if [ "$pr_fingerprint" = "$expected_fingerprint" ]; then
                blocked_by_data_pr=true
                echo "::notice::Open benchmark data PR #$pr_number already contains this input fingerprint; waiting for its normal merge."
                break
              fi
            fi
          done <<< "$open_data_prs"

          needs_benchmark=false
          if [ "$blocked_by_data_pr" = "true" ]; then
            needs_benchmark=true
          elif [ "$stale" != "false" ] || ! node scripts/validate-scoped-benchmark-data.js; then
            needs_benchmark=true
          fi

          echo "needs_benchmark=$needs_benchmark" >> "$GITHUB_OUTPUT"
          echo "blocked_by_data_pr=$blocked_by_data_pr" >> "$GITHUB_OUTPUT"
          if [ "$blocked_by_data_pr" = "true" ]; then
            echo "A matching benchmark data PR is already open; no duplicate simulation or docs publication will run."
          elif [ "$needs_benchmark" = "true" ]; then
            echo "Benchmark inputs or published observations are incomplete; this documentation pipeline will generate its own data."
          else
            echo "The committed benchmark data matches current inputs and passes completeness validation; no simulation will run."
          fi

  benchmark:
    needs: prepare
    if: needs.prepare.outputs.needs_benchmark == 'true' && needs.prepare.outputs.blocked_by_data_pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      dispatch_docs: ${{ steps.publish.outputs.dispatch_docs }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run the Scoped Range strategy sensitivity matrix
        run: set -o pipefail && node scripts/strategy-sensitivity.js | tee strategy-sensitivity-output.txt
      - name: Run Absolute R+ search-parameter sensitivity
        run: set -o pipefail && node scripts/gaml-sensitivity.js | tee gaml-sensitivity-output.txt
      - name: Validate the complete benchmark dataset
        run: node scripts/validate-scoped-benchmark-data.js
      - name: Write and verify the benchmark input fingerprint
        run: |
          node scripts/benchmark-fingerprint.js --write
          test "$(node scripts/benchmark-fingerprint.js --check)" = "false"
      - name: Publish generated data through a timestamped data branch and PR
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "dispatch_docs=false" >> "$GITHUB_OUTPUT"
          local_fingerprint="$(node -p "JSON.parse(require('fs').readFileSync('docs/strategies/benchmarks/.input-fingerprint.json', 'utf8')).fingerprint")"

          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          temp_root="$(mktemp -d)"
          verify_tree="$temp_root/verify"
          git worktree add --detach "$verify_tree" "$remote_sha" >/dev/null
          remote_fingerprint="$(cd "$verify_tree" && node scripts/benchmark-fingerprint.js --write)"
          remote_data_valid=false
          if (cd "$verify_tree" && node scripts/validate-scoped-benchmark-data.js >/dev/null); then
            remote_data_valid=true
          fi
          git worktree remove --force "$verify_tree"
          rmdir "$temp_root"
          if [ "$remote_fingerprint" != "$local_fingerprint" ]; then
            echo "Refusing to publish benchmark output: main advanced to a different input fingerprint."
            exit 1
          fi
          if [ "$remote_data_valid" = "true" ]; then
            echo "Main already contains a complete dataset for this fingerprint; reusing it instead of overwriting newer data."
            gh workflow run docs-pages.yml --ref main
            echo "dispatch_docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          output_root="$(mktemp -d)"
          mkdir -p "$output_root/docs/strategies/benchmarks"
          cp docs/strategies/benchmarks/results.json "$output_root/docs/strategies/benchmarks/"
          cp docs/strategies/benchmarks/gaml-search-results.json "$output_root/docs/strategies/benchmarks/"
          cp docs/strategies/benchmarks/.input-fingerprint.json "$output_root/docs/strategies/benchmarks/"

          publish_timestamp="$(TZ=Asia/Colombo date '+%Y-%m-%d-%H-%M-%S-LKT')"
          publish_branch="data-$publish_timestamp"
          if git ls-remote --exit-code origin "refs/heads/$publish_branch" >/dev/null 2>&1; then
            publish_branch="$publish_branch-$GITHUB_RUN_ID"
          fi
          git checkout -B "$publish_branch" origin/main
          cp "$output_root/docs/strategies/benchmarks/results.json" docs/strategies/benchmarks/results.json
          cp "$output_root/docs/strategies/benchmarks/gaml-search-results.json" docs/strategies/benchmarks/gaml-search-results.json
          cp "$output_root/docs/strategies/benchmarks/.input-fingerprint.json" docs/strategies/benchmarks/.input-fingerprint.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/strategies/benchmarks/results.json
          git add docs/strategies/benchmarks/gaml-search-results.json
          git add docs/strategies/benchmarks/.input-fingerprint.json
          if ! git diff --cached --quiet; then
            git commit -m "benchmarks: refresh scoped strategy measurements ($publish_timestamp LKT)"
            git push origin "HEAD:refs/heads/$publish_branch"
            pr_url="$(gh pr create --base main --head "$publish_branch" --title "benchmarks: refresh scoped strategy measurements ($publish_timestamp LKT)" --body "Automated Scoped Range benchmark output for input fingerprint ${local_fingerprint}. Generated at ${publish_timestamp} Sri Lanka Time (Asia/Colombo).")"
            gh pr merge "$pr_url" --merge
            merged_at="$(gh pr view "$pr_url" --json mergedAt --jq '.mergedAt')"
            if [ -z "$merged_at" ] || [ "$merged_at" = "null" ]; then
              echo "Benchmark data PR did not merge; refusing to build or publish documentation."
              exit 1
            fi
            echo "Merged validated benchmark data through $publish_branch at $merged_at."
            gh workflow run docs-pages.yml --ref main
            echo "dispatch_docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "The generated dataset is identical to the current main data; no data PR is required."
          fi
      - name: Preserve benchmark execution logs
        if: always()
        run: |
          test -f strategy-sensitivity-output.txt || echo "No strategy output was produced." > strategy-sensitivity-output.txt
          test -f gaml-sensitivity-output.txt || echo "No Absolute R+ output was produced." > gaml-sensitivity-output.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: docs-owned-scoped-benchmark-run
          path: |
            strategy-sensitivity-output.txt
            gaml-sensitivity-output.txt
          retention-days: 30

  build:
    needs: [prepare, benchmark]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.blocked_by_data_pr != 'true' && (needs.benchmark.result == 'skipped' || (needs.benchmark.result == 'success' && needs.benchmark.outputs.dispatch_docs != 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Capture documentation dependency revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build and validate the documentation component
        run: bash scripts/build-docs-site.sh /tmp/docs-site
      - uses: actions/upload-artifact@v6
        with:
          name: docs-site
          path: /tmp/docs-site
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-artifact-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          name: docs-site
          path: /tmp/docs-site
      - name: Publish documentation without touching the web component
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git diff --quiet "$SOURCE_SHA" origin/main -- docs scripts/benchmark-fingerprint.js scripts/strategy-sensitivity.js scripts/gaml-sensitivity.js scripts/validate-scoped-benchmark-data.js scripts/build-docs-site.sh src/core src/strategies src/fd-options src/io/csv.js src/brand/favicon.svg data/banks data/fd_options; then
            echo "::notice::Documentation or benchmark inputs changed after this artifact was built; a newer docs run owns publication."
            exit 0
          fi
          branch="pages-docs-artifact"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "refs/remotes/origin/$branch"
          else
            git switch --orphan "$branch"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          git clean -fd
          cp -R /tmp/docs-site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The documentation artifact branch already contains this component."
          else
            git commit -m "pages: publish documentation from ${GITHUB_SHA}"
            git push origin "HEAD:refs/heads/$branch"
          fi

  deploy:
    needs: publish
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: write
      pages: write
      id-token: write
      deployments: read
\t' read -r pr_number pr_branch; do
            [ -n "$pr_branch" ] || continue
            git fetch --no-tags origin "refs/heads/$pr_branch:refs/remotes/origin/$pr_branch"
            if git show "refs/remotes/origin/$pr_branch:docs/strategies/benchmarks/.input-fingerprint.json" > "$RUNNER_TEMP/data-pr-fingerprint.json" 2>/dev/null; then
              pr_fingerprint="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).fingerprint)" "$RUNNER_TEMP/data-pr-fingerprint.json")"
              if [ "$pr_fingerprint" = "$expected_fingerprint" ]; then
                blocked_by_data_pr=true
                echo "::notice::Open benchmark data PR #$pr_number already contains this input fingerprint; waiting for its normal merge."
                break
              fi
            fi
          done <<< "$open_data_prs"

          needs_benchmark=false
          if [ "$blocked_by_data_pr" = "true" ]; then
            needs_benchmark=true
          elif [ "$stale" != "false" ] || ! node scripts/validate-scoped-benchmark-data.js; then
            needs_benchmark=true
          fi

          echo "needs_benchmark=$needs_benchmark" >> "$GITHUB_OUTPUT"
          echo "blocked_by_data_pr=$blocked_by_data_pr" >> "$GITHUB_OUTPUT"
          if [ "$blocked_by_data_pr" = "true" ]; then
            echo "A matching benchmark data PR is already open; no duplicate simulation or docs publication will run."
          elif [ "$needs_benchmark" = "true" ]; then
            echo "Benchmark inputs or published observations are incomplete; this documentation pipeline will generate its own data."
          else
            echo "The committed benchmark data matches current inputs and passes completeness validation; no simulation will run."
          fi

  benchmark:
    needs: prepare
    if: needs.prepare.outputs.needs_benchmark == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      dispatch_docs: ${{ steps.publish.outputs.dispatch_docs }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run the Scoped Range strategy sensitivity matrix
        run: set -o pipefail && node scripts/strategy-sensitivity.js | tee strategy-sensitivity-output.txt
      - name: Run Absolute R+ search-parameter sensitivity
        run: set -o pipefail && node scripts/gaml-sensitivity.js | tee gaml-sensitivity-output.txt
      - name: Validate the complete benchmark dataset
        run: node scripts/validate-scoped-benchmark-data.js
      - name: Write and verify the benchmark input fingerprint
        run: |
          node scripts/benchmark-fingerprint.js --write
          test "$(node scripts/benchmark-fingerprint.js --check)" = "false"
      - name: Publish generated data through a timestamped data branch and PR
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "dispatch_docs=false" >> "$GITHUB_OUTPUT"
          local_fingerprint="$(node -p "JSON.parse(require('fs').readFileSync('docs/strategies/benchmarks/.input-fingerprint.json', 'utf8')).fingerprint")"

          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          temp_root="$(mktemp -d)"
          verify_tree="$temp_root/verify"
          git worktree add --detach "$verify_tree" "$remote_sha" >/dev/null
          remote_fingerprint="$(cd "$verify_tree" && node scripts/benchmark-fingerprint.js --write)"
          remote_data_valid=false
          if (cd "$verify_tree" && node scripts/validate-scoped-benchmark-data.js >/dev/null); then
            remote_data_valid=true
          fi
          git worktree remove --force "$verify_tree"
          rmdir "$temp_root"
          if [ "$remote_fingerprint" != "$local_fingerprint" ]; then
            echo "Refusing to publish benchmark output: main advanced to a different input fingerprint."
            exit 1
          fi
          if [ "$remote_data_valid" = "true" ]; then
            echo "Main already contains a complete dataset for this fingerprint; reusing it instead of overwriting newer data."
            gh workflow run docs-pages.yml --ref main
            echo "dispatch_docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          output_root="$(mktemp -d)"
          mkdir -p "$output_root/docs/strategies/benchmarks"
          cp docs/strategies/benchmarks/results.json "$output_root/docs/strategies/benchmarks/"
          cp docs/strategies/benchmarks/gaml-search-results.json "$output_root/docs/strategies/benchmarks/"
          cp docs/strategies/benchmarks/.input-fingerprint.json "$output_root/docs/strategies/benchmarks/"

          publish_timestamp="$(TZ=Asia/Colombo date '+%Y-%m-%d-%H-%M-%S-LKT')"
          publish_branch="data-$publish_timestamp"
