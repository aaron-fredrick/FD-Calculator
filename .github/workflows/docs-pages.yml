    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-artifact-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          name: docs-site
          path: /tmp/docs-site
      - name: Publish documentation without touching the web component
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git diff --quiet "$SOURCE_SHA" origin/main -- docs scripts/benchmark-fingerprint.js scripts/strategy-sensitivity.js scripts/gaml-sensitivity.js scripts/validate-scoped-benchmark-data.js scripts/build-docs-site.sh src/core src/strategies src/fd-options src/io/csv.js src/brand/favicon.svg data/banks data/fd_options; then
            echo "::notice::Documentation or benchmark inputs changed after this artifact was built; a newer docs run owns publication."
            exit 0
          fi
          branch="pages-docs-artifact"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "refs/remotes/origin/$branch"
          else
            git switch --orphan "$branch"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          git clean -fd
          cp -R /tmp/docs-site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The documentation artifact branch already contains this component."
          else
            git commit -m "pages: publish documentation from ${GITHUB_SHA}"
            git push origin "HEAD:refs/heads/$branch"
          fi

  deploy:
    needs: publish
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: write
      pages: write
      id-token: write
      deployments: read
