name: Deploy FD Cal web app and documentation
on:
  push:
    branches: [main]
    paths:
      - "src/web/**"
      - "src/brand/**"
      - "src/core/**"
      - "src/fd-options/**"
      - "src/strategies/**"
      - "src/io/csv.js"
      - "src/reporting/**"
      - "schema/**"
      - "data/**"
      - "docs/**"
      - "README.md"
      - "robots.txt"
      - "CONTRIBUTING.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Install documentation generator
        run: npm install --no-save --package-lock=false vitepress@2.0.0-alpha.21
      - name: Assemble static site
        run: |
          mkdir -p site/web site/docs site/brand site/core site/fd-options site/strategies site/io site/reporting
          cp -R src/web/. site/web/
          cp -R src/brand/. site/brand/
          cp -R src/core/. site/core/
          cp -R src/fd-options/. site/fd-options/
          cp -R src/strategies/. site/strategies/
          cp src/io/csv.js site/io/csv.js
          cp -R src/reporting/. site/reporting/
          cp -R data site/data
          cp -R schema site/schema
          npm exec -- vitepress build docs
          cp src/brand/favicon.svg site/favicon.svg
          cp src/brand/favicon.svg site/docs/favicon.svg
          cp src/brand/og-image.svg site/og-image.svg
          cp robots.txt site/robots.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          site = Path("site")
          namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", namespace)
          docs_sitemap = site / "docs" / "sitemap.xml"
          sitemap = ET.parse(docs_sitemap).getroot()
          existing = {node.text for node in sitemap.findall(f"{{{namespace}}}url/{{{namespace}}}loc")}
          for url in (
              "https://aaron-fredrick.github.io/FD-Calculator/",
              "https://aaron-fredrick.github.io/FD-Calculator/web/",
          ):
              if url not in existing:
                  item = ET.SubElement(sitemap, f"{{{namespace}}}url")
                  ET.SubElement(item, f"{{{namespace}}}loc").text = url
          ET.ElementTree(sitemap).write(site / "sitemap.xml", encoding="utf-8", xml_declaration=True)
          PY
          cp README.md CONTRIBUTING.md site/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#0b0e13">
            <meta name="description" content="FD Cal is a Sri Lankan fixed-deposit portfolio optimiser. Compare bank products, model cash flows and evaluate investment strategies.">
            <meta name="robots" content="index,follow">
            <link rel="canonical" href="https://aaron-fredrick.github.io/FD-Calculator/web/">
            <link rel="icon" type="image/svg+xml" href="./favicon.svg">
            <meta http-equiv="refresh" content="0; url=./web/">
            <meta property="og:type" content="website">
            <meta property="og:site_name" content="FD Cal">
            <meta property="og:title" content="FD Cal — Fixed Deposit Portfolio Optimiser">
            <meta property="og:description" content="Plan and compare Sri Lankan bank fixed deposits with a multi-strategy portfolio simulator.">
            <meta property="og:url" content="https://aaron-fredrick.github.io/FD-Calculator/">
            <meta property="og:image" content="https://aaron-fredrick.github.io/FD-Calculator/og-image.svg">
            <meta name="twitter:card" content="summary_large_image">
            <meta name="twitter:image" content="https://aaron-fredrick.github.io/FD-Calculator/og-image.svg">
            <title>FD Cal — Fixed Deposit Portfolio Optimiser</title>
          </head>
          <body>
            <p>Opening <a href="./web/">FD Cal</a>…</p>
            <script>window.location.replace("./web/");</script>
          </body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Remove superseded GitHub Pages deployment records
        uses: actions/github-script@v8
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: "github-pages",
              per_page: 100
            });

            for (const deployment of deployments) {
              // The environment may already have created the current run's deployment.
              // Keep that record; only remove deployments superseded by this commit.
              if (deployment.sha === context.sha) continue;

              const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                per_page: 100
              });
              const latest = statuses[0];

              if (!latest || latest.state !== "inactive") {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  environment_url: latest && latest.environment_url,
                  description: "Superseded Pages deployment removed before publishing the current site."
                });
              }

              await github.rest.repos.deleteDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id
              });
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
