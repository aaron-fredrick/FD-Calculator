name: Deploy FD Cal web app
on:
  push:
    branches: [main]
    paths:
      - "src/web/**"
      - "src/core/**"
      - "src/fd-options/**"
      - "src/strategies/**"
      - "src/io/csv.js"
      - "src/reporting/**"
      - "schema/**"
      - "data/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble static site
        run: |
          mkdir -p site/web site/docs site/core site/fd-options site/strategies site/io site/reporting
          cp -R src/web/. site/web/
          cp -R src/core/. site/core/
          cp -R src/fd-options/. site/fd-options/
          cp -R src/strategies/. site/strategies/
          cp src/io/csv.js site/io/csv.js
          cp -R src/reporting/. site/reporting/
          cp -R data site/data
          cp -R schema site/schema
          cp -R docs/. site/docs/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./web/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FD Cal</title></head><body><p>Opening <a href="./web/">FD Cal</a>…</p></body></html>
          EOF
          cat > site/docs/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=https://github.com/aaron-fredrick/FD-Calculator/tree/main/docs"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FD Cal — Documentation</title></head><body><p>Browse the <a href="https://github.com/aaron-fredrick/FD-Calculator/tree/main/docs">FD Cal documentation</a>.</p></body></html>
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
