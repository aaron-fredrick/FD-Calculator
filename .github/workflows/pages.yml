name: Assemble and deploy the independent Pages components

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.assemble.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/configure-pages@v6
      - name: Assemble the latest published web and docs components
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site

          for branch in pages-web-artifact pages-docs-artifact; do
            if ! git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::notice::Waiting for both independent site components; $branch has not been published yet."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
          done

          git archive origin/pages-web-artifact | tar -x -C site
          git archive origin/pages-docs-artifact | tar -x -C site
          touch site/.nojekyll

          test -s site/index.html
          test -s site/web/index.html
          test -s site/docs/index.html
          test -s site/sitemap.xml

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Assembled the latest web and documentation artifacts."

      - uses: actions/upload-pages-artifact@v5
        if: steps.assemble.outputs.ready == 'true'
        with:
          path: site

  deploy:
    needs: assemble
    if: needs.assemble.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the assembled site
        id: deployment
        uses: actions/deploy-pages@v5
