name: Assemble and deploy the independent Pages components

on:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.assemble.outputs.ready }}
      changed: ${{ steps.assemble.outputs.changed }}
      web_sha: ${{ steps.assemble.outputs.web_sha }}
      docs_sha: ${{ steps.assemble.outputs.docs_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/configure-pages@v6
      - name: Find the last successfully deployed source revision
        id: live
        uses: actions/github-script@v8
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: "github-pages",
              per_page: 100
            });

            for (const deployment of deployments) {
              const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                per_page: 100
              });
              if (statuses[0]?.state === "success") {
                core.setOutput("sha", deployment.sha);
                core.info(`Using last successful Pages source revision ${deployment.sha} for docs preservation.`);
                return;
              }
            }

            core.setOutput("sha", "");
            core.notice("No successful Pages deployment record was found; docs baseline bootstrap may be unavailable.");

      - name: Bootstrap missing component baselines without replacing published artifacts
        env:
          DOCS_SOURCE_SHA: ${{ steps.live.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          branch_exists() {
            git ls-remote --exit-code origin "refs/heads/$1" >/dev/null 2>&1
          }

          web_needed=false
          docs_needed=false
          if ! branch_exists pages-web-artifact && ! branch_exists pages-web-baseline; then
            web_needed=true
          fi
          if ! branch_exists pages-docs-artifact && ! branch_exists pages-docs-baseline; then
            docs_needed=true
          fi

          if [ "$web_needed" = "true" ]; then
            bash scripts/build-web-site.sh /tmp/web-baseline
          fi

          if [ "$docs_needed" = "true" ] && [ -n "$DOCS_SOURCE_SHA" ]; then
            git fetch --no-tags origin "$DOCS_SOURCE_SHA"
            git worktree add --detach /tmp/docs-source "$DOCS_SOURCE_SHA"
            mkdir -p /tmp/docs-source/scripts
            cp scripts/build-docs-preservation.sh /tmp/docs-source/scripts/build-docs-preservation.sh
            (cd /tmp/docs-source && bash scripts/build-docs-preservation.sh /tmp/docs-baseline)
            git worktree remove --force /tmp/docs-source
          elif [ "$docs_needed" = "true" ]; then
            echo "::notice::No prior successful Pages source is available; the docs baseline will wait for a validated docs publication."
          fi

          publish_baseline() {
            local branch="$1"
            local directory="$2"
            if branch_exists "$branch"; then
              echo "Baseline $branch was created by another publisher; preserving it."
              return
            fi
            git switch --orphan "$branch"
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fd
            cp -R "$directory"/. .
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "pages: seed $branch from the last usable component"
              git push origin "HEAD:refs/heads/$branch"
            fi
          }

          if [ "$web_needed" = "true" ]; then
            publish_baseline pages-web-baseline /tmp/web-baseline
          fi
          if [ "$docs_needed" = "true" ] && [ -d /tmp/docs-baseline ]; then
            publish_baseline pages-docs-baseline /tmp/docs-baseline
          fi

      - name: Assemble the latest published web and docs components
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site

          select_component_ref() {
            local actual="$1"
            local baseline="$2"
            if git ls-remote --exit-code origin "refs/heads/$actual" >/dev/null 2>&1; then
              echo "$actual"
            elif git ls-remote --exit-code origin "refs/heads/$baseline" >/dev/null 2>&1; then
              echo "$baseline"
            else
              echo ""
            fi
          }

          web_ref="$(select_component_ref pages-web-artifact pages-web-baseline)"
          docs_ref="$(select_component_ref pages-docs-artifact pages-docs-baseline)"
          if [ -z "$web_ref" ] || [ -z "$docs_ref" ]; then
            echo "::notice::Both web and docs must have a published or preserved baseline before Pages can deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "refs/heads/$web_ref:refs/remotes/origin/$web_ref"
          git fetch --no-tags origin "refs/heads/$docs_ref:refs/remotes/origin/$docs_ref"
          web_sha="$(git rev-parse "origin/$web_ref")"
          docs_sha="$(git rev-parse "origin/$docs_ref")"
          echo "web_sha=$web_sha" >> "$GITHUB_OUTPUT"
          echo "docs_sha=$docs_sha" >> "$GITHUB_OUTPUT"

          git archive "origin/$web_ref" | tar -x -C site
          git archive "origin/$docs_ref" | tar -x -C site
          touch site/.nojekyll

          test -s site/index.html
          test -s site/web/index.html
          test -s site/docs/index.html
          test -s site/sitemap.xml

          previous_web_sha=""
          previous_docs_sha=""
          if git ls-remote --exit-code origin refs/heads/pages-deploy-state >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/pages-deploy-state:refs/remotes/origin/pages-deploy-state
            if git show origin/pages-deploy-state:deployment.json > /tmp/pages-deployment-state.json 2>/dev/null; then
              previous_web_sha="$(jq -r '.web_artifact_sha // empty' /tmp/pages-deployment-state.json)"
              previous_docs_sha="$(jq -r '.docs_artifact_sha // empty' /tmp/pages-deployment-state.json)"
            fi
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ "$web_sha" = "$previous_web_sha" ] && [ "$docs_sha" = "$previous_docs_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Both component revisions are already deployed; skipping duplicate Pages deployment."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Assembled web $web_ref ($web_sha) and docs $docs_ref ($docs_sha)."
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.assemble.outputs.ready == 'true' && steps.assemble.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: assemble
    if: needs.assemble.outputs.ready == 'true' && needs.assemble.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the assembled site
        id: deployment
        uses: actions/deploy-pages@v5

  record:
    needs: [assemble, deploy]
    if: needs.deploy.result == 'success' && needs.assemble.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Record the deployed component revisions
        shell: bash
        env:
          WEB_SHA: ${{ needs.assemble.outputs.web_sha }}
          DOCS_SHA: ${{ needs.assemble.outputs.docs_sha }}
        run: |
          set -euo pipefail
          branch="pages-deploy-state"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "refs/remotes/origin/$branch"
          else
            git switch --orphan "$branch"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          git clean -fd
          printf '{\n  "web_artifact_sha": "%s",\n  "docs_artifact_sha": "%s"\n}\n' "$WEB_SHA" "$DOCS_SHA" > deployment.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment.json
          if ! git diff --cached --quiet; then
            git commit -m "pages: record deployed component revisions"
            git push origin "HEAD:refs/heads/$branch"
          fi
