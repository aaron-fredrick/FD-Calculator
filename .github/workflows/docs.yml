name: Documentation pull-request check

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install documentation generator
        run: npm install --no-save --package-lock=false vitepress@2.0.0-alpha.21
      - name: Build documentation
        run: npm exec -- vitepress build docs
      - name: Verify generated site layout
        run: |
          test -s site/docs/index.html
          test -s site/docs/strategies/index.html
          test -s site/docs/strategies/GSS.html
          grep -q '/FD-Calculator/docs/assets/' site/docs/index.html
