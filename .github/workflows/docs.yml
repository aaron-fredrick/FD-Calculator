name: Documentation build

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install documentation generator
        run: npm install --no-save --package-lock=false vitepress@1.6.4
      - name: Build documentation
        run: npm exec -- vitepress build docs
