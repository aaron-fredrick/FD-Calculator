name: Search budget calibration

on:
  push:
    branches: ["audit/owner-feedback-followups"]
    paths:
      - "scripts/search-budget-calibration.js"
      - ".github/workflows/search-budget-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    name: Compare Absolute R+ search budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run 5k / 10k / 20k / uncapped × 15s / 30s / 60s matrix
        run: node scripts/search-budget-calibration.js
        env:
          SEARCH_BUDGET_OUTPUT: ${{ runner.temp }}/search-budget-calibration.json
      - name: Upload calibration results
        uses: actions/upload-artifact@v4
        with:
          name: search-budget-calibration-${{ github.sha }}
          path: ${{ runner.temp }}/search-budget-calibration.json
          if-no-files-found: error
          retention-days: 30
