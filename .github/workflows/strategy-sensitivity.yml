name: Strategy sensitivity study
on:
  push:
    branches: ["feature/**"]
    paths:
      - "scripts/strategy-sensitivity.js"
      - "scripts/gaml-sensitivity.js"
      - "src/core/**"
      - "src/strategies/**"
      - "src/fd-options/**"
      - "data/banks/**"
      - "data/fd_options/**"
      - ".github/workflows/strategy-sensitivity.yml"
  workflow_dispatch:
concurrency:
  group: strategy-sensitivity-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run strategy sensitivity study
        run: set -o pipefail && node scripts/strategy-sensitivity.js | tee strategy-sensitivity-output.txt
      - name: Run GAML search sensitivity study
        run: set -o pipefail && node scripts/gaml-sensitivity.js | tee gaml-sensitivity-output.txt
      - name: Upload benchmark output
        uses: actions/upload-artifact@v6
        with:
          name: strategy-sensitivity-results
          path: |
            strategy-sensitivity-output.txt
            gaml-sensitivity-output.txt
          retention-days: 14
