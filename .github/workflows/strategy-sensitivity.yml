name: Scoped strategy benchmarks

on:
  push:
    branches: ["feature/**", "chore/**"]
    paths:
      - "scripts/benchmark-fingerprint.js"
      - "scripts/coordinate-benchmark-runs.js"
      - "scripts/strategy-sensitivity.js"
      - "scripts/gaml-sensitivity.js"
      - "src/core/**"
      - "src/strategies/**"
      - "src/fd-options/**"
      - "src/io/csv.js"
      - "data/banks/**"
      - "data/fd_options/**"
  pull_request:
    branches: [main]
    paths:
      - "scripts/benchmark-fingerprint.js"
      - "scripts/coordinate-benchmark-runs.js"
      - "scripts/strategy-sensitivity.js"
      - "scripts/gaml-sensitivity.js"
      - "src/core/**"
      - "src/strategies/**"
      - "src/fd-options/**"
      - "src/io/csv.js"
      - "data/banks/**"
      - "data/fd_options/**"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  coordinate:
    if: github.ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: benchmark-fingerprint-coordinator
      cancel-in-progress: false
    outputs:
      decision: ${{ steps.coordinate.outputs.decision }}
      fingerprint: ${{ steps.coordinate.outputs.fingerprint }}
      reuse_run_id: ${{ steps.coordinate.outputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Coordinate active benchmark runs by input fingerprint
        id: coordinate
        run: node scripts/coordinate-benchmark-runs.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sensitivity:
    needs: coordinate
    if: |
      github.ref != 'refs/heads/main' && (
      (needs.coordinate.result == 'success' && needs.coordinate.outputs.decision == 'run') ||
      (needs.coordinate.result == 'skipped' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check benchmark input fingerprint
        id: cache
        run: |
          stale="$(node scripts/benchmark-fingerprint.js --check)"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          if [ "$stale" = "true" ]; then
            echo "Benchmark inputs changed or cached outputs are missing; regenerating."
          else
            echo "Benchmark inputs and cached outputs match; skipping simulation runs."
          fi
      - name: Run scoped strategy sensitivity and interaction matrix
        if: steps.cache.outputs.stale == 'true'
        run: set -o pipefail && node scripts/strategy-sensitivity.js | tee strategy-sensitivity-output.txt
      - name: Validate expanded sensitivity dataset
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const data = JSON.parse(readFileSync("docs/strategies/benchmarks/results.json", "utf8"));
          const rows = data.results;
          const strategies = ["Greedy", "Absolute R+", "GSS"];
          const groups = new Map();
          for (const row of rows) {
            const key = row.category + "|" + row.value;
            groups.set(key, [...(groups.get(key) ?? []), row]);
          }
          assert.equal(rows.length, 324, "Expected 324 strategy observations");
          assert.equal(groups.size, 108, "Expected 108 distinct scenario points");
          for (const [key, group] of groups) {
            assert.deepEqual(group.map(row => row.strategy).sort(), [...strategies].sort(), key + " must include all strategies");
          }
          const values = category => [...new Set(rows.filter(row => row.category === category).map(row => Number(row.value)))].sort((a, b) => a - b);
          assert.deepEqual(values("horizon_months"), Array.from({ length: 21 }, (_, i) => i * 3));
          assert.deepEqual(values("inflow_monthly_amount_lkr"), Array.from({ length: 21 }, (_, i) => i * 10000));
          assert.deepEqual(values("outflow_monthly_amount_lkr"), Array.from({ length: 21 }, (_, i) => i * 10000));
          assert.deepEqual(values("inflow_duration_months"), Array.from({ length: 12 }, (_, i) => i + 1));
          assert.deepEqual(values("outflow_duration_months"), Array.from({ length: 12 }, (_, i) => i + 1));
          for (const row of rows.filter(row => ["inflow_monthly_amount_lkr", "inflow_duration_months", "outflow_monthly_amount_lkr", "outflow_duration_months"].includes(row.category))) {
            assert.equal(row.months, 24, "Cash-flow sweeps must run for 2 years");
          }
          for (const row of rows.filter(row => row.category === "inflow_duration_months")) {
            assert.equal(row.inflow_amount, 100000, "Inflow duration sweep must hold the monthly amount fixed");
            assert.equal(row.inflow_duration_months, Number(row.value), "Inflow duration must match the x-axis value");
          }
          for (const row of rows.filter(row => row.category === "outflow_duration_months")) {
            assert.equal(row.outflow_amount, 100000, "Outflow duration sweep must hold the monthly amount fixed");
            assert.equal(row.outflow_duration_months, Number(row.value), "Outflow duration must match the x-axis value");
          }
          for (const row of rows.filter(row => row.category.startsWith("outflow_") && row.valid === false && row.outflow_unpaid === null)) {
            assert.equal(row.outflows_paid, null, "Unexecuted outflow totals must remain unmeasured");
            assert.ok(Number.isFinite(row.outflow_scheduled_total), "Scheduled outflows must be reported separately");
          }
          console.log("Validated 324 observations, 108 scenarios, 0–60m horizon, and four 2-year cash-flow sweeps.");
          NODE
      - name: Run Absolute R+ search-parameter sensitivity
        if: steps.cache.outputs.stale == 'true'
        run: set -o pipefail && node scripts/gaml-sensitivity.js | tee gaml-sensitivity-output.txt
      - name: Store benchmark input fingerprint
        if: steps.cache.outputs.stale == 'true'
        run: node scripts/benchmark-fingerprint.js --write
      - name: Verify the generated Scoped Range benchmark cache is reusable
        if: steps.cache.outputs.stale == 'true'
        run: test "$(node scripts/benchmark-fingerprint.js --check)" = "false"
      # Benchmark JSON is an ephemeral run artifact. Production docs builds
      # regenerate it on main and pass it directly to the docs build; PR runs
      # must not push generated snapshots back into source branches.
      - name: Preserve benchmark run output
        if: always()
        run: |
          if [ ! -f strategy-sensitivity-output.txt ]; then
            echo "Benchmark simulation skipped because the fingerprint and cached outputs were current." > strategy-sensitivity-output.txt
          fi
          if [ ! -f gaml-sensitivity-output.txt ]; then
            echo "Absolute R+ parameter sweep skipped because the fingerprint and cached outputs were current." > gaml-sensitivity-output.txt
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scoped-strategy-benchmarks
          path: |
            strategy-sensitivity-output.txt
            gaml-sensitivity-output.txt
            docs/strategies/benchmarks/results.json
            docs/strategies/benchmarks/gaml-search-results.json
            docs/strategies/benchmarks/.input-fingerprint.json
          retention-days: 1
