name: Absolute R+ search sensitivity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/absolute-r-plus-sensitivity.yml"
      - "scripts/gaml-sensitivity.js"
      - "src/strategies/**"
      - "src/core/**"
      - "src/fd-options/**"
      - "src/io/csv.js"
      - "data/banks/**"
      - "data/fd_options/**"

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Absolute R+ parameter sensitivity
        run: set -o pipefail && node scripts/gaml-sensitivity.js | tee gaml-sensitivity-output.txt
      - name: Upload sensitivity results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: absolute-r-plus-sensitivity
          path: |
            gaml-sensitivity-output.txt
            docs/strategies/benchmarks/gaml-search-results.json
          if-no-files-found: warn
          retention-days: 30
