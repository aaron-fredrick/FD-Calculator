name: Goal achievement sensitivity study
on:
  push:
    branches: ["feature/**"]
    paths:
      - "scripts/goal-achievement-sensitivity.js"
      - "src/core/**"
      - "src/strategies/**"
      - "src/fd-options/**"
      - "data/banks/**"
      - "data/fd_options/**"
      - ".github/workflows/goal-achievement-sensitivity.yml"
  workflow_dispatch:
concurrency:
  group: goal-sensitivity-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  goal-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run goal achievement sensitivity study
        run: set -o pipefail && node scripts/goal-achievement-sensitivity.js | tee goal-achievement-sensitivity-output.txt
      - name: Publish generated goal benchmark charts and data to the feature branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            mkdir -p /tmp/goal-achievement-output
            cp -R docs/strategies/assets/goal-achievement/. /tmp/goal-achievement-output/
            git fetch origin "$GITHUB_REF_NAME"
            git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
            mkdir -p docs/strategies/assets/goal-achievement
            cp -R /tmp/goal-achievement-output/. docs/strategies/assets/goal-achievement/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/strategies/assets/goal-achievement/
            if ! git diff --cached --quiet; then
              git commit -m "docs: publish goal-mode strategy sensitivity results"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
      - name: Upload goal benchmark output
        uses: actions/upload-artifact@v6
        with:
          name: goal-achievement-sensitivity-results
          path: |
            goal-achievement-sensitivity-output.txt
            docs/strategies/assets/goal-achievement/
          retention-days: 30
