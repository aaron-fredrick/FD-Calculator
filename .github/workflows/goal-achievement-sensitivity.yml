name: Goal objective development benchmarks

on:
  push:
    branches: ["feature/**", "chore/**"]
    paths:
      - "scripts/goal-achievement-sensitivity.js"
      - "scripts/goal-benchmark-fingerprint.js"
      - "src/core/**"
      - "src/strategies/**"
      - "src/fd-options/**"
      - "src/io/csv.js"
      - "data/banks/**"
      - "data/fd_options/**"
      - ".github/workflows/goal-achievement-sensitivity.yml"
  workflow_dispatch:

concurrency:
  group: benchmark-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  goal-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check Goal benchmark input fingerprint
        id: cache
        run: |
          stale="$(node scripts/goal-benchmark-fingerprint.js --check)"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          if [ "$stale" = "true" ]; then
            echo "Goal benchmark inputs changed or cached outputs are missing; regenerating."
          else
            echo "Goal benchmark inputs and cached outputs match; skipping simulation runs."
          fi
      - name: Run Goal achievement sensitivity study
        if: steps.cache.outputs.stale == 'true'
        run: set -o pipefail && node scripts/goal-achievement-sensitivity.js | tee goal-achievement-sensitivity-output.txt
      - name: Store Goal benchmark input fingerprint
        if: steps.cache.outputs.stale == 'true'
        run: node scripts/goal-benchmark-fingerprint.js --write
      - name: Verify the generated Goal benchmark cache is reusable
        if: steps.cache.outputs.stale == 'true'
        run: test "$(node scripts/goal-benchmark-fingerprint.js --check)" = "false"
      - name: Publish development benchmark outputs to the working branch
        if: steps.cache.outputs.stale == 'true' && github.ref_type == 'branch' && github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          remote_fingerprint=""
          if git show "origin/${GITHUB_REF_NAME}:docs/strategies/assets/goal-achievement/.input-fingerprint.json" > /tmp/remote-benchmark-fingerprint.json 2>/dev/null; then
            remote_fingerprint="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/remote-benchmark-fingerprint.json', 'utf8')).fingerprint")"
          fi
          local_fingerprint="$(node -p "JSON.parse(require('fs').readFileSync('docs/strategies/assets/goal-achievement/.input-fingerprint.json', 'utf8')).fingerprint")"
          if [ -n "$remote_fingerprint" ] && [ "$remote_fingerprint" = "$local_fingerprint" ]; then
            echo "Matching benchmark inputs were already published by another run; skipping duplicate commit."
            exit 0
          fi
          git add docs/strategies/assets/goal-achievement/
          if ! git diff --cached --quiet; then
            git commit -m "benchmarks: refresh Goal development measurements"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
              echo "Branch advanced during publish; retrying after rebase (attempt ${attempt}/3)."
            done
            exit 1
          fi
      - name: Preserve benchmark run output
        if: always()
        run: |
          if [ ! -f goal-achievement-sensitivity-output.txt ]; then
            echo "Goal benchmark simulation skipped because the fingerprint and cached outputs were current." > goal-achievement-sensitivity-output.txt
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: goal-development-benchmarks
          path: |
            goal-achievement-sensitivity-output.txt
            docs/strategies/assets/goal-achievement/
          retention-days: 30
