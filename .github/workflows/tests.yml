name: Node.js tests and syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 22 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Syntax-check application, benchmark and test modules
        run: find src scripts tests/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax-check component build scripts
        run: bash -n scripts/build-web-site.sh && bash -n scripts/build-docs-site.sh && bash -n scripts/build-docs-preservation.sh
      - name: Parse all GitHub Actions workflow YAML files
        run: ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file, aliases: true); puts "Validated #{file}" }' .github/workflows/*.yml
