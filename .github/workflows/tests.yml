name: Node.js tests and syntax checks

on:
  push:
    branches: [main, dev, 'audit/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 22 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify generated report tokens
        run: npm run check:report-tokens
      - name: Run test suite
        run: npm test
      - name: Syntax-check application, benchmark and test modules
        run: find src scripts tests/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax-check component build scripts
        run: bash -n scripts/build-web-site.sh && bash -n scripts/build-docs-site.sh && bash -n scripts/build-docs-preservation.sh
      - name: Build production and dev browser-test artifacts
        run: |
          bash scripts/build-web-site.sh "$RUNNER_TEMP/web-site"
          FD_CAL_PREVIEW=true bash scripts/build-web-site.sh "$RUNNER_TEMP/dev-web-site"
          test -s "$RUNNER_TEMP/web-site/web/index.html"
          test -s "$RUNNER_TEMP/web-site/web/simulation.worker.js"
          test -s "$RUNNER_TEMP/web-site/web/simulation-task.js"
          test -s "$RUNNER_TEMP/web-site/web/simulation-runner.js"
          test -s "$RUNNER_TEMP/dev-web-site/web/index.html"
      - name: Install pinned Playwright test dependency
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run production and dev-preview browser smoke tests
        run: npm run test:browser
      - name: Build the preserved documentation baseline
        run: |
          bash scripts/build-docs-preservation.sh "$RUNNER_TEMP/docs-baseline"
          test -s "$RUNNER_TEMP/docs-baseline/docs/index.html"
      - name: Build production and dev documentation
        run: |
          bash scripts/build-docs-site.sh "$RUNNER_TEMP/docs-site"
          FD_CAL_PREVIEW=true bash scripts/build-docs-site.sh "$RUNNER_TEMP/dev-docs-site"
          test -s "$RUNNER_TEMP/docs-site/docs/index.html"
          test -s "$RUNNER_TEMP/dev-docs-site/docs/index.html"
      - name: Parse all GitHub Actions workflow YAML files
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file, aliases: true); puts "Validated #{file}" }' .github/workflows/pages.yml .github/workflows/web-pages.yml .github/workflows/docs-pages.yml .github/workflows/strategy-sensitivity.yml .github/workflows/dev-web-pages.yml .github/workflows/dev-docs-pages.yml .github/workflows/search-budget-calibration.yml .github/workflows/tests.yml
