name: Bug report
description: Report incorrect behaviour, a calculation issue, or a broken part of FD Cal.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check whether the issue has already been reported.
        Do not include account numbers, passwords, personal information, or unredacted financial data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the exact steps and inputs needed to reproduce the issue.
      placeholder: |
        1. Open...
        2. Configure...
        3. Run...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include any error message or relevant console output.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web configurator
        - CLI
        - Calculation engine / strategy
        - HTML report
        - Bank or FD product data
        - Configuration import / export
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FD Cal version or commit
      description: Provide a release/version or commit SHA if known.
      placeholder: e.g. main @ abc1234
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, or Node.js version and OS, as applicable.
      placeholder: e.g. Firefox 130 on Windows 11
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Attach screenshots or sanitized logs. Remove personal and financial information first.
    validations:
      required: false
