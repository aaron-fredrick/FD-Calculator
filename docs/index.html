<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FD Cal Docs</title><style>body{margin:0;background:#0b0e13;color:#e8edf5;font:14px system-ui}a{color:#8ac8ef;text-decoration:none}.layout{display:grid;grid-template-columns:240px 1fr 260px;gap:20px}aside,main{padding:20px}.navlink{display:block;padding:6px;color:#a5b4c6}.navlink.active{background:#1a2a39;color:#bce3ff}.article{max-width:850px}.article h1{font-size:38px}.article h2{margin-top:36px;border-bottom:1px solid #273447;padding-bottom:8px}.article p,.article li{color:#c0ccda}.article pre{overflow:auto;background:#080d13;padding:14px}.article table{border-collapse:collapse;display:block;overflow:auto}.article td,.article th{padding:8px;border:1px solid #273447}.search{width:100%;padding:10px;background:#111923;color:#e8edf5;border:1px solid #35465b}.result{display:block;padding:8px;background:#111923;margin:5px 0}.result small{color:#a5b4c6}.toc a{display:block;padding:4px;color:#a5b4c6}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:24px}.card{padding:16px;background:#111923;border:1px solid #273447}.card span{display:block;color:#a5b4c6}.footer{margin-top:45px;color:#8190a3;border-top:1px solid #273447;padding-top:14px}@media(max-width:1050px){.layout{grid-template-columns:210px minmax(0,1fr)}.right{grid-column:2;border-top:1px solid #273447}}@media(max-width:700px){.layout{display:block}.left{display:none}}</style><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script></head><body><header style="padding:15px;border-bottom:1px solid #273447">FD Cal / Documentation <a href="../web/" style="float:right">Open app</a></header><div class="layout"><aside class="left"><b>START HERE</b><a class="navlink" data-page="README.md" href="?page=README.md">Project overview</a><a class="navlink" data-page="CONTRIBUTING.md" href="?page=CONTRIBUTING.md">Development setup</a><p><b>USER GUIDE</b><a class="navlink" data-page="docs/ISSUES.md" href="?page=docs/ISSUES.md">Support and issues</a></p><p><b>STRATEGIES</b><a class="navlink" data-page="docs/STRATEGIES.md" href="?page=docs/STRATEGIES.md">Strategy overview</a><a class="navlink" data-page="docs/strategies/GSS.md" href="?page=docs/strategies/GSS.md">GSS reference</a></p><p><b>ARCHITECTURE</b><a class="navlink" data-page="docs/MIGRATION_PLAN.md" href="?page=docs/MIGRATION_PLAN.md">Engine and migration</a><a class="navlink" data-page="docs/reference/CODEBASE.md" href="?page=docs/reference/CODEBASE.md">Codebase map</a></p><p><b>TOOLS AND LIBRARIES</b><a class="navlink" href="?page=docs/reference/CODEBASE.md#fd-option-manager">FD option management</a><a class="navlink" href="?page=docs/reference/CODEBASE.md#shared-modules">Shared modules</a></p></aside><main><article id="article" class="article">Loading…</article></main><aside class="right"><b>SEARCH DOCUMENTATION</b><input id="search" class="search" placeholder="Search pages and sections"><div id="results"></div><hr><b>ON THIS PAGE</b><nav id="toc" class="toc"></nav></aside></div><script>(function(){const pages=[{path:"README.md",title:"Project overview",group:"Start here",description:"What FD Cal does, source layout and runtime model."},{path:"CONTRIBUTING.md",title:"Development setup",group:"Start here",description:"Node setup, tests, engineering constraints and PR checklist."},{path:"docs/ISSUES.md",title:"Support and issue reporting",group:"User guide",description:"Issue forms, public support, labels and issue lifecycle."},{path:"docs/STRATEGIES.md",title:"Strategy overview",group:"Strategies",description:"Greedy, GAML, GSS and Absolute decision models."},{path:"docs/strategies/GSS.md",title:"GSS technical reference",group:"Strategies",description:"Candidate ordering, SPLIT and CONSOLIDATE, recursion and forecast contraction."},{path:"docs/MIGRATION_PLAN.md",title:"Engine and migration plan",group:"Architecture",description:"Shared JavaScript runtime and parity requirements."},{path:"docs/reference/CODEBASE.md",title:"Codebase map",group:"Architecture",description:"Responsibilities of engine, strategy, I/O and reporting modules."}];const article=document.getElementById("article"),toc=document.getElementById("toc"),search=document.getElementById("search"),results=document.getElementById("results"),cache=new Map(),index=[];function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}function slug(s){return s.toLowerCase().trim().replace(/[^a-z0-9 -]/g,"").replace(/ +/g,"-");}async function load(page){const p=page.path;if(cache.has(p))return cache.get(p);let r=await fetch("../"+encodeURI(p));if(!r.ok)throw Error(p+" unavailable");let md=await r.text();cache.set(p,md);let title=page.title,body="";for(let line of md.split("\n")){let h=line.match(/^#{1,3}\s+(.+)/);if(h){if(body)index.push({p,title,body});title=h[1];body="";}else body+=" "+line;}if(body)index.push({p,title,body});return md;}async function init(){await Promise.all(pages.map(x=>load(x).catch(()=>null)));}function home(){article.innerHTML="<h1>Documentation</h1><p>Guides and technical references for the FD Cal application, engine, strategies and supporting libraries.</p><div class='cards'>"+pages.map(x=>'<a class="card" href="?page='+encodeURIComponent(x.path)+'"><strong>'+esc(x.title)+'</strong><span>'+esc(x.description)+'</span></a>').join("")+"</div><div class='footer'>FD Cal documentation · Verify bank-specific terms independently.</div>";toc.innerHTML="";}function hi(s,q){let safe=esc(s);for(let term of q.trim().split(/\s+/).filter(Boolean)){let at=safe.toLowerCase().indexOf(term.toLowerCase());if(at>=0)safe=safe.slice(0,at)+"<mark>"+safe.slice(at,at+term.length)+"</mark>"+safe.slice(at+term.length);}return safe;}function searchDocs(q){results.innerHTML="";if(!q)return;let words=q.toLowerCase().split(/\s+/).filter(Boolean),found=index.filter(x=>words.every(w=>(x.title+" "+x.body).toLowerCase().includes(w)));if(!found.length){results.innerHTML="<p>No matching pages or sections.</p>";return;}results.innerHTML=found.slice(0,30).map(x=>{let pos=x.body.toLowerCase().indexOf(words[0]),snippet=x.body.slice(Math.max(0,pos-35),pos+130);return '<a class="result" href="?page='+encodeURIComponent(x.p)+'&section='+encodeURIComponent(slug(x.title))+'&q='+encodeURIComponent(q)+'"><b>'+hi(x.title,q)+'</b><br><small>'+hi(snippet,q)+'</small></a>';}).join("");}function tocBuild(){let hs=[...article.querySelectorAll("h2,h3")];toc.innerHTML=hs.map(h=>{h.id=h.id||slug(h.textContent);return '<p><a href="#'+h.id+'">'+esc(h.textContent)+'</a></p>';}).join("");}function hiArticle(q){if(!q)return;let walker=document.createTreeWalker(article,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode()){let n=walker.currentNode;if(n.parentElement.closest("pre,code,script,style,mark"))continue;if(q.split(/\s+/).some(w=>n.nodeValue.toLowerCase().includes(w.toLowerCase())))nodes.push(n);}for(let n of nodes){let span=document.createElement("span");span.innerHTML=hi(n.nodeValue,q);n.parentNode.replaceChild(span,n);}}async function render(p,section,q){let page=pages.find(x=>x.path===p);if(!page){home();return;}try{let md=await load(page);if(!window.marked||!window.DOMPurify)throw Error("Markdown renderer unavailable; check network connectivity.");article.innerHTML='<div style="color:#8190a3;font-size:12px">FD Cal / '+esc(page.group)+' / '+esc(page.title)+'</div>'+DOMPurify.sanitize(marked.parse(md,{gfm:true}),{USE_PROFILES:{html:true}})+'<div class="footer">Source: <a target="_blank" href="https://github.com/aaron-fredrick/FD-Calculator/blob/main/'+encodeURI(p)+'">repository Markdown ↗</a> · <a href="./">Documentation home</a></div>';tocBuild();if(section){let el=document.getElementById(section);if(el)el.scrollIntoView();}hiArticle(q);document.querySelectorAll(".navlink").forEach(a=>a.classList.toggle("active",a.dataset.page===p));}catch(e){article.innerHTML='<p>Unable to display this page: '+esc(e.message)+'. <a href="https://github.com/aaron-fredrick/FD-Calculator/tree/main/docs">Browse docs on GitHub</a>.</p>';}}search.addEventListener("input",()=>searchDocs(search.value));document.addEventListener("keydown",e=>{if(e.key==="/"&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();search.focus();}});(async()=>{await init();let params=new URLSearchParams(location.search),p=params.get("page");if(p){search.value=params.get("q")||"";searchDocs(search.value);await render(p,params.get("section")||"",params.get("q")||"");}else home();})();})();</script></body></html>
