<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e13">
  <meta name="description" content="FD Cal project documentation.">
  <title>FD Cal — Documentation</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b0e13;color:#e8edf5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,680px);padding:36px;border:1px solid #273447;border-radius:16px;background:#111923}
    .eyebrow{color:#8da4bd;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:12px 0;font-size:clamp(28px,6vw,40px)}
    p{color:#aebdce;line-height:1.7}
    a{color:#8ac8ef}
    .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px}
    .links a{display:inline-block;padding:10px 14px;border:1px solid #34465c;border-radius:8px;text-decoration:none}
    .links a:hover{background:#1b2a3b}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">FD Cal / Project</div>
    <h1>Documentation</h1>
    <p>Project guides and reference material are maintained in the repository documentation directory.</p>
    <div class="links">
      <a href="https://github.com/aaron-fredrick/FD-Calculator/tree/main/docs">Browse documentation</a>
      <a href="../web/">Open FD Cal</a>
    </div>
  </main>
</body>
</html>
