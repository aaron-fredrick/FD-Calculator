name: Python tests

on:
  push:
    branches:
      - feature/cash-flows
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q core fd_cal.py
      - name: Check report JavaScript syntax
        run: node --check core/report_templates/report.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
